<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');
      
      .title-text {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        fill: url(#metallicGradient);
      }
      
      .subtitle-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 3px;
        fill: #B00020;
      }
      
      .sys-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #a1a1aa;
        letter-spacing: 1px;
      }

      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #ffffff;
      }

      /* 60 FPS Smooth Keyframes */
      @keyframes scanlineSmooth {
        0% { transform: translateY(-30px); opacity: 0; }
        10% { opacity: 0.7; }
        90% { opacity: 0.7; }
        100% { transform: translateY(310px); opacity: 0; }
      }

      @keyframes holographicPulse {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50% { opacity: 0.22; transform: scale(1.08); }
      }

      @keyframes cornerPulse {
        0%, 100% { stroke: #B00020; opacity: 1; }
        50% { stroke: #ff1e42; opacity: 0.6; }
      }

      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-20px) translateX(10px); opacity: 0.7; }
        100% { transform: translateY(-40px) translateX(0px); opacity: 0.2; }
      }

      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.1; }
      }

      .scanner-beam {
        animation: scanlineSmooth 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .holo-glow {
        animation: holographicPulse 4s ease-in-out infinite;
        transform-origin: center;
      }

      .corner-hud {
        animation: cornerPulse 3s ease-in-out infinite;
      }

      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }

      .cursor {
        animation: cursorBlink 1s step-end infinite;
      }
    </style>

    <!-- Metallic Reflection Gradient -->
    <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e4e4e7" />
      <stop offset="50%" stop-color="#B00020" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <!-- Holographic Scanner Beam Gradient -->
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="#B00020" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#B00020" stop-opacity="0.4" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Outer Container -->
  <rect width="850" height="310" rx="16" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Tactical Grid -->
  <rect width="850" height="310" rx="16" fill="url(#grid)" />

  <!-- Holographic Ambient Glows -->
  <circle class="holo-glow" cx="720" cy="70" r="150" fill="#B00020" />
  <circle class="holo-glow" cx="120" cy="240" r="130" fill="#B00020" />

  <!-- Moving Floating Particles -->
  <circle class="particle-1" cx="200" cy="180" r="1.5" fill="#ffffff" />
  <circle class="particle-2" cx="550" cy="100" r="2" fill="#B00020" />
  <circle class="particle-3" cx="700" cy="220" r="1" fill="#ffffff" />
  <circle class="particle-1" cx="380" cy="70" r="1.5" fill="#B00020" />

  <!-- Inner Panel Glass Box -->
  <rect x="24" y="24" width="802" height="262" rx="12" fill="#121212" fill-opacity="0.8" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Animated Corner HUD Brackets -->
  <path class="corner-hud" d="M 24 44 L 24 24 L 44 24" fill="none" stroke-width="3" />
  <path class="corner-hud" d="M 806 24 L 826 24 L 826 44" fill="none" stroke-width="3" />
  <path class="corner-hud" d="M 24 266 L 24 286 L 44 286" fill="none" stroke-width="3" />
  <path class="corner-hud" d="M 806 286 L 826 286 L 826 266" fill="none" stroke-width="3" />

  <!-- Scanner Sweep Beam -->
  <rect class="scanner-beam" x="24" y="0" width="802" height="8" fill="url(#scannerGrad)" />

  <!-- Header Status Bar -->
  <g transform="translate(48, 56)">
    <!-- Dynamic Halo Pulse -->
    <circle cx="6" cy="6" r="6" fill="#10B981" opacity="0.3">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="6" cy="6" r="3.5" fill="#10B981" />
    
    <text x="22" y="10" class="sys-tag">SYS.ACTIVE // ID: RifqiAqil-ops</text>
    <text x="295" y="10" class="sys-tag">|</text>
    <text x="315" y="10" class="sys-tag" fill="#10B981">SOFTWARE DEVELOPER</text>
  </g>

  <!-- Title: RIFQI AQIL -->
  <g transform="translate(48, 135)">
    <text x="0" y="0" class="title-text">RIFQI AQIL</text>
  </g>

  <!-- Subtitle Typing Line -->
  <g transform="translate(48, 178)">
    <text x="0" y="0" class="subtitle-text">SOFTWARE ENGINEER // LARAVEL &amp; PHP DEVELOPER</text>
    <rect class="cursor" x="475" y="-13" width="8" height="15" fill="#B00020" />
  </g>

  <!-- Specification Badges -->
  <g transform="translate(48, 218)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="125" height="26" rx="6" fill="#090909" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="12" cy="13" r="3" fill="#B00020" />
    <text x="24" y="17" class="badge-text">LARAVEL 12</text>

    <!-- Pill 2 -->
    <rect x="135" y="0" width="150" height="26" rx="6" fill="#090909" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="147" cy="13" r="3" fill="#10B981" />
    <text x="159" y="17" class="badge-text">SMART DSS METHOD</text>

    <!-- Pill 3 -->
    <rect x="295" y="0" width="120" height="26" rx="6" fill="#090909" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="307" cy="13" r="3" fill="#3B82F6" />
    <text x="319" y="17" class="badge-text">BLADE ENGINE</text>

    <!-- Pill 4 -->
    <rect x="425" y="0" width="135" height="26" rx="6" fill="#090909" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="437" cy="13" r="3" fill="#F59E0B" />
    <text x="449" y="17" class="badge-text">GLOBAL SUPPLY</text>
  </g>

  <!-- Right Decorative Telemetry Box -->
  <g transform="translate(645, 56)">
    <rect x="0" y="0" width="155" height="188" rx="8" fill="#090909" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <line x1="0" y1="34" x2="155" y2="34" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="22" font-family="JetBrains Mono" font-size="9" fill="#a1a1aa" font-weight="700">OVERVIEW</text>
    <circle cx="138" cy="17" r="3" fill="#B00020" />

    <text x="14" y="60" font-family="JetBrains Mono" font-size="9" fill="#71717a">REPOSITORIES</text>
    <text x="14" y="78" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#ffffff">5 PUBLIC</text>

    <text x="14" y="112" font-family="JetBrains Mono" font-size="9" fill="#71717a">PRIMARY STACK</text>
    <text x="14" y="130" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="#B00020">LARAVEL / PHP</text>

    <text x="14" y="162" font-family="JetBrains Mono" font-size="9" fill="#71717a">STATUS</text>
    <text x="14" y="176" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#10B981">ACTIVE</text>
  </g>
</svg>
