<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');
      
      .title-text {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-weight: 800;
        font-size: 48px;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: url(#metallicGradient);
      }
      
      .subtitle-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 3px;
        fill: #B00020;
      }
      
      .sys-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #a1a1aa;
        letter-spacing: 1px;
      }

      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 600;
        fill: #e4e4e7;
      }
      
      /* Subtle Smooth Animations */
      @keyframes scanlineSmooth {
        0% { transform: translateY(-20px); opacity: 0; }
        15% { opacity: 0.5; }
        85% { opacity: 0.5; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      
      @keyframes softBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.15; }
      }

      @keyframes softPulse {
        0% { r: 3.5px; opacity: 1; }
        50% { r: 5.5px; opacity: 0.5; }
        100% { r: 3.5px; opacity: 1; }
      }

      .scanner-beam {
        animation: scanlineSmooth 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .blinking-cursor {
        animation: softBlink 1.2s ease-in-out infinite;
      }

      .status-pulse {
        animation: softPulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Refined Metallic Shimmer Gradient -->
    <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e4e4e7" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- Softer Scanner Beam Gradient -->
    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#B00020" stop-opacity="0.35" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Container -->
  <rect width="850" height="300" rx="14" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Grid -->
  <rect width="850" height="300" rx="14" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="750" cy="70" r="140" fill="#B00020" opacity="0.06" filter="blur(40px)" />
  <circle cx="100" cy="230" r="120" fill="#B00020" opacity="0.04" filter="blur(40px)" />

  <!-- Inner Panel Box -->
  <rect x="24" y="24" width="802" height="252" rx="10" fill="#121212" fill-opacity="0.75" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#B00020" stroke-width="2.5" />
  <path d="M 810 24 L 826 24 L 826 40" fill="none" stroke="#B00020" stroke-width="2.5" />
  <path d="M 24 260 L 24 276 L 40 276" fill="none" stroke="#B00020" stroke-width="2.5" />
  <path d="M 810 276 L 826 276 L 826 260" fill="none" stroke="#B00020" stroke-width="2.5" />

  <!-- Scanner Sweep -->
  <rect class="scanner-beam" x="24" y="0" width="802" height="6" fill="url(#scannerGrad)" />

  <!-- Header Status Bar -->
  <g transform="translate(48, 56)">
    <circle cx="6" cy="6" r="3.5" fill="#10B981" />
    <circle class="status-pulse" cx="6" cy="6" r="3.5" fill="#10B981" />
    
    <text x="20" y="10" class="sys-tag">SYS.ACTIVE // ID: RifqiAqil-ops</text>
    <text x="290" y="10" class="sys-tag">|</text>
    <text x="310" y="10" class="sys-tag" fill="#10B981">SOFTWARE DEVELOPER</text>
  </g>

  <!-- Title: RIFQI AQIL -->
  <g transform="translate(48, 130)">
    <text x="0" y="0" class="title-text">RIFQI AQIL</text>
  </g>

  <!-- Subtitle Typing Line -->
  <g transform="translate(48, 172)">
    <text x="0" y="0" class="subtitle-text">SOFTWARE ENGINEER // LARAVEL &amp; PHP DEVELOPER</text>
    <rect class="blinking-cursor" x="460" y="-13" width="7" height="15" fill="#B00020" />
  </g>

  <!-- Specification Pills -->
  <g transform="translate(48, 210)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="125" height="24" rx="5" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="12" cy="12" r="2.5" fill="#B00020" />
    <text x="22" y="16" class="badge-text">LARAVEL 12</text>

    <!-- Pill 2 -->
    <rect x="135" y="0" width="145" height="24" rx="5" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="147" cy="12" r="2.5" fill="#10B981" />
    <text x="157" y="16" class="badge-text">SMART DSS METHOD</text>

    <!-- Pill 3 -->
    <rect x="290" y="0" width="115" height="24" rx="5" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="302" cy="12" r="2.5" fill="#3B82F6" />
    <text x="312" y="16" class="badge-text">BLADE ENGINE</text>

    <!-- Pill 4 -->
    <rect x="415" y="0" width="135" height="24" rx="5" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="427" cy="12" r="2.5" fill="#F59E0B" />
    <text x="437" y="16" class="badge-text">GLOBAL SUPPLY</text>
  </g>

  <!-- Right Side Stat Box -->
  <g transform="translate(645, 56)">
    <rect x="0" y="0" width="155" height="178" rx="8" fill="#090909" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <line x1="0" y1="32" x2="155" y2="32" stroke="rgba(255,255,255,0.06)" />
    <text x="14" y="21" font-family="JetBrains Mono" font-size="9" fill="#a1a1aa" font-weight="600">OVERVIEW</text>
    <circle cx="138" cy="16" r="2.5" fill="#B00020" />

    <text x="14" y="56" font-family="JetBrains Mono" font-size="9" fill="#71717a">REPOSITORIES</text>
    <text x="14" y="74" font-family="JetBrains Mono" font-size="15" font-weight="700" fill="#ffffff">5 PUBLIC</text>

    <text x="14" y="104" font-family="JetBrains Mono" font-size="9" fill="#71717a">PRIMARY STACK</text>
    <text x="14" y="122" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="#B00020">LARAVEL / PHP</text>

    <text x="14" y="152" font-family="JetBrains Mono" font-size="9" fill="#71717a">STATUS</text>
    <text x="14" y="166" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#10B981">ACTIVE</text>
  </g>
</svg>
