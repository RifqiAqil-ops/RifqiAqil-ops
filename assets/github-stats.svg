<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="100%" height="170">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #B00020; letter-spacing: 1px; }
      .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #a1a1aa; }
      .value { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .subtext { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #10B981; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="400" height="170" rx="10" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <rect x="10" y="10" width="380" height="150" rx="8" fill="#121212" fill-opacity="0.8" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Title -->
  <text x="25" y="36" class="title">RIFQI AQIL // GITHUB TELEMETRY</text>
  <line x1="25" y1="46" x2="375" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Row 1: Repositories -->
  <g transform="translate(25, 72)">
    <text x="0" y="0" class="label">Public Repositories</text>
    <text x="350" y="0" class="value" text-anchor="end">5 Repos</text>
  </g>

  <!-- Row 2: Core Stack -->
  <g transform="translate(25, 98)">
    <text x="0" y="0" class="label">Primary Stack</text>
    <text x="350" y="0" class="value" text-anchor="end" fill="#B00020">Laravel 12 / PHP 8.2</text>
  </g>

  <!-- Row 3: Decision Systems -->
  <g transform="translate(25, 124)">
    <text x="0" y="0" class="label">Decision Systems</text>
    <text x="350" y="0" class="value" text-anchor="end">SMART Method</text>
  </g>

  <!-- Status Bar -->
  <g transform="translate(25, 146)">
    <circle cx="4" cy="-4" r="3" fill="#10B981" />
    <text x="14" y="-1" class="subtext">VERIFIED ACTIVE DEVELOPER</text>
  </g>
</svg>
