<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="100%" height="170">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #B00020; letter-spacing: 1px; }
      .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #a1a1aa; }
      .pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="400" height="170" rx="10" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <rect x="10" y="10" width="380" height="150" rx="8" fill="#121212" fill-opacity="0.8" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Title -->
  <text x="25" y="36" class="title">MOST USED LANGUAGES</text>
  <line x1="25" y1="46" x2="375" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Lang 1: Blade / Laravel -->
  <g transform="translate(25, 68)">
    <circle cx="5" cy="-4" r="4" fill="#B00020" />
    <text x="16" y="0" class="label">Blade (Laravel)</text>
    <text x="350" y="0" class="pct" text-anchor="end">48%</text>
    <rect x="16" y="6" width="334" height="4" rx="2" fill="rgba(255,255,255,0.06)" />
    <rect x="16" y="6" width="160" height="4" rx="2" fill="#B00020" />
  </g>

  <!-- Lang 2: PHP -->
  <g transform="translate(25, 98)">
    <circle cx="5" cy="-4" r="4" fill="#777BB4" />
    <text x="16" y="0" class="label">PHP 8.2+</text>
    <text x="350" y="0" class="pct" text-anchor="end">32%</text>
    <rect x="16" y="6" width="334" height="4" rx="2" fill="rgba(255,255,255,0.06)" />
    <rect x="16" y="6" width="106" height="4" rx="2" fill="#777BB4" />
  </g>

  <!-- Lang 3: JavaScript & HTML/CSS -->
  <g transform="translate(25, 128)">
    <circle cx="5" cy="-4" r="4" fill="#F7DF1E" />
    <text x="16" y="0" class="label">JavaScript &amp; HTML/CSS</text>
    <text x="350" y="0" class="pct" text-anchor="end">20%</text>
    <rect x="16" y="6" width="334" height="4" rx="2" fill="rgba(255,255,255,0.06)" />
    <rect x="16" y="6" width="67" height="4" rx="2" fill="#F7DF1E" />
  </g>
</svg>
