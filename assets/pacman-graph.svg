<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      
      .title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; fill: #F59E0B; letter-spacing: 1px; }
      .text-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #71717a; }

      /* Pacman Mouth Chomp Animation */
      @keyframes pacmanChomp {
        0%, 100% { d: path('M 12 12 L 22 4 A 10 10 0 1 0 22 20 Z'); }
        50% { d: path('M 12 12 L 22 11 A 10 10 0 1 0 22 13 Z'); }
      }

      /* Pacman Movement Across the Graph */
      @keyframes pacmanMove {
        0% { transform: translateX(0px); }
        100% { transform: translateX(760px); }
      }

      /* Ghost Movement Chasing Pacman */
      @keyframes ghostMove {
        0% { transform: translateX(-60px); }
        100% { transform: translateX(700px); }
      }

      /* Dot Fade Out as Pacman Eats Them */
      @keyframes dotDisappear {
        0% { opacity: 1; transform: scale(1); }
        45% { opacity: 1; transform: scale(1.2); }
        50% { opacity: 0; transform: scale(0); }
        100% { opacity: 0; transform: scale(0); }
      }

      .pacman-body {
        animation: pacmanChomp 0.3s ease-in-out infinite;
        fill: #F59E0B;
      }

      .pacman-group {
        animation: pacmanMove 12s linear infinite;
      }

      .ghost-group {
        animation: ghostMove 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Container -->
  <rect width="850" height="200" rx="12" fill="#090909" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <!-- Header Bar -->
  <g transform="translate(25, 25)">
    <text x="0" y="0" class="title">🎮 PAC-MAN CONTRIBUTION GRAPH</text>
    <text x="760" y="0" class="text-sub" text-anchor="end">DAILY SYNCED</text>
    <line x1="0" y1="12" x2="760" y2="12" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  </g>

  <!-- Contribution Grid Matrix -->
  <g transform="translate(30, 55)">
    <!-- 52 columns x 7 rows simulation grid -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#121212" stroke="rgba(255,255,255,0.05)" />
    <rect x="15" y="0" width="10" height="10" rx="2" fill="#B00020" opacity="0.4" />
    <rect x="30" y="0" width="10" height="10" rx="2" fill="#B00020" opacity="0.8" />
    <rect x="45" y="0" width="10" height="10" rx="2" fill="#B00020" />
    <rect x="60" y="0" width="10" height="10" rx="2" fill="#121212" />
    <rect x="75" y="0" width="10" height="10" rx="2" fill="#B00020" opacity="0.6" />
    <rect x="90" y="0" width="10" height="10" rx="2" fill="#B00020" />
    <rect x="105" y="0" width="10" height="10" rx="2" fill="#121212" />
    <rect x="120" y="0" width="10" height="10" rx="2" fill="#B00020" opacity="0.4" />

    <!-- Animated Eating Maze Line for Pacman (Row 4 middle path) -->
    <g transform="translate(0, 45)">
      <!-- Animated dots eaten sequence -->
      <circle cx="20" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 0.3s;" />
      <circle cx="60" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 0.9s;" />
      <circle cx="100" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 1.5s;" />
      <circle cx="140" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 2.1s;" />
      <circle cx="180" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 2.7s;" />
      <circle cx="220" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 3.3s;" />
      <circle cx="260" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 3.9s;" />
      <circle cx="300" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 4.5s;" />
      <circle cx="340" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 5.1s;" />
      <circle cx="380" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 5.7s;" />
      <circle cx="420" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 6.3s;" />
      <circle cx="460" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 6.9s;" />
      <circle cx="500" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 7.5s;" />
      <circle cx="540" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 8.1s;" />
      <circle cx="580" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 8.7s;" />
      <circle cx="620" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 9.3s;" />
      <circle cx="660" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 9.9s;" />
      <circle cx="700" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 10.5s;" />
      <circle cx="740" cy="5" r="3.5" fill="#F59E0B" style="animation: dotDisappear 12s linear infinite 11.1s;" />
    </g>

    <!-- Grid Squares Matrix background representation -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="790" height="90" rx="4" fill="#121212" opacity="0.4" />
    </g>

    <!-- PAC-MAN CHARACTER -->
    <g class="pacman-group" transform="translate(0, 40)">
      <path class="pacman-body" d="M 12 12 L 22 4 A 10 10 0 1 0 22 20 Z" />
      <circle cx="12" cy="6" r="1.5" fill="#090909" />
    </g>

    <!-- RED GHOST (BLINKY) CHASING PACMAN -->
    <g class="ghost-group" transform="translate(0, 40)">
      <path d="M -15 2 A 8 8 0 0 1 -1 2 L -1 18 L -4 15 L -8 18 L -12 15 L -15 18 Z" fill="#EF4444" />
      <circle cx="-11" cy="7" r="2" fill="#ffffff" />
      <circle cx="-5" cy="7" r="2" fill="#ffffff" />
      <circle cx="-10" cy="7" r="1" fill="#3B82F6" />
      <circle cx="-4" cy="7" r="1" fill="#3B82F6" />
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(30, 170)">
    <text x="0" y="0" class="text-sub">CONTRIBUTION LEVEL</text>
    <rect x="130" y="-8" width="10" height="10" rx="2" fill="#121212" stroke="rgba(255,255,255,0.1)" />
    <rect x="145" y="-8" width="10" height="10" rx="2" fill="#B00020" opacity="0.3" />
    <rect x="160" y="-8" width="10" height="10" rx="2" fill="#B00020" opacity="0.6" />
    <rect x="175" y="-8" width="10" height="10" rx="2" fill="#B00020" opacity="0.9" />
    <rect x="190" y="-8" width="10" height="10" rx="2" fill="#F59E0B" />
    <text x="210" y="0" class="text-sub">HIGH (PAC-MAN TARGETS)</text>
  </g>
</svg>
