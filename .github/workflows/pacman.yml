name: Generate Pac-Man Contribution Graph

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  
  # Allows manually triggering the workflow from GitHub Actions tab
  workflow_dispatch:
  
  # Run on every push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Pac-Man Contribution Graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RifqiAqil-ops
          outputs: |
            assets/pacman-graph.svg?palette=github-dark

      - name: Commit & Push Pac-Man Graph to Main Branch
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update daily pac-man contribution graph"
          file_pattern: "assets/pacman-graph.svg"
